<svg viewBox="0 0 338 220" fill="none" xmlns="http://www.w3.org/2000/svg" width="338" height="220" role="img"><title>Discovery and market scan (hover the card)</title><style><![CDATA[
svg{cursor:pointer}
.conn {fill:none;animation:dash 1.6s linear infinite}
.ring {fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.ring.end {stroke:rgba(240,60,60,.7);animation:ripple 2.4s ease-out infinite}
.ring.ph {stroke:rgba(105,67,199,.55);animation:ripple 2s ease-out infinite}
.ring.b {animation-delay:1.1s}
#g2-magnifying-glass {animation:magPath 6s cubic-bezier(.22,.8,.24,1) infinite;filter:drop-shadow(0 6px 10px rgba(80,40,190,.25))}
#g2-checklist-depth, #g2-checklist-middle-layer {transition:transform .6s cubic-bezier(.22,.8,.24,1)}
svg:hover #g2-checklist-depth {transform:translate(9px,-5px) rotate(2deg)}
svg:hover #g2-checklist-middle-layer {transform:translate(4px,-2px) rotate(1deg)}
#g2-checklist-line-6, #g2-checklist-line-5, #g2-checklist-line-4, #g2-checklist-line-3, #g2-checklist-line-2, #g2-checklist-line {transform-box:fill-box;transform-origin:0 50%;animation:scanLine 6s cubic-bezier(.22,.8,.24,1) infinite}
#g2-checklist-line-6, #g2-checklist-line-5 {animation-delay:-4.2s}
#g2-checklist-line-4, #g2-checklist-line-3 {animation-delay:-2.6s}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes ripple{0%{opacity:.9;scale:.9}100%{opacity:0;scale:1.9}}
@keyframes magPath{0%,12%{translate:0 0}33%,46%{translate:-74px -85px}66%,80%{translate:-23px -45px}100%{translate:0 0}}
@keyframes scanLine{0%,10%,30%,100%{fill:#D9D5FF;scale:1 1}18%{fill:#9f8cf5;scale:1.12 1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001s!important}}
