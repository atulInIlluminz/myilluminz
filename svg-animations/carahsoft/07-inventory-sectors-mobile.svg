<svg viewBox="0 0 360 985" width="360" height="985" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"><title>One inventory, many frameworks (mobile)</title><style>
text{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{fill:#fff;stroke:#ebe5ff}
.ttl{font-size:16px;font-weight:500;fill:#170b3b}
.lbl{font-size:10px;letter-spacing:.08em;fill:#8b76e0;font-weight:500}
.fw rect{fill:#f7f3ff;stroke:#e3dafd}
.fw text{font-size:11px;font-weight:500;fill:#3d2690}
.icon{transform-box:fill-box;transform-origin:center}
.spine{stroke:#a59aff;stroke-width:2;stroke-dasharray:4 4;fill:none;animation:dash 1s linear infinite}
.endpoint{fill:#6943c7}
.packet{fill:#7f5fd9;animation:drip 1.6s linear infinite}
.sector{animation:secIn .7s cubic-bezier(.22,1,.36,1) both}
.s1{animation-delay:.08s}.s2{animation-delay:.16s}.s3{animation-delay:.24s}.s4{animation-delay:.32s}
#hub-orbit,#hub-orbit-2{transform-box:fill-box;transform-origin:center}
#hub-orbit{animation:spin 30s linear infinite}
#hub-orbit-2{animation:spin 46s linear infinite reverse}
#hub-hub-glow{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
#hub-platform-face{animation:bob 3s ease-in-out infinite}
#hub-layered-platform{animation:bob 3s ease-in-out -.4s infinite}
@keyframes secIn{from{opacity:0;translate:0 16px}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes drip{from{translate:0 0;opacity:1}to{translate:0 22px;opacity:0}}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{50%{scale:1.06}}
@keyframes bob{50%{translate:0 -7px}}
@keyframes secCard{0%,1.2%{stroke:#ebe5ff;fill:#fff}3%,18%{stroke:#b8a3ff;fill:#fdfbff}20%,100%{stroke:#ebe5ff;fill:#fff}}
@keyframes secChip{0%,1.2%{fill:#f7f3ff;stroke:#e3dafd}3%,18%{fill:#6943c7;stroke:#6943c7}20%,100%{fill:#f7f3ff;stroke:#e3dafd}}
@keyframes secChipT{0%,1.2%{fill:#3d2690}3%,18%{fill:#fff}20%,100%{fill:#3d2690}}
@keyframes secIcon{0%,1.2%{scale:1;rotate:0deg}3%,18%{scale:1.08;rotate:-4deg}20%,100%{scale:1;rotate:0deg}}
.s0 .card{animation:secCard 13s linear 0s infinite}.s0 .fw rect{animation:secChip 13s linear 0s infinite}.s0 .fw text{animation:secChipT 13s linear 0s infinite}.s0 .icon{animation:secIcon 13s linear 0s infinite}
.s1 .card{animation:secCard 13s linear 2.6s infinite}.s1 .fw rect{animation:secChip 13s linear 2.6s infinite}.s1 .fw text{animation:secChipT 13s linear 2.6s infinite}.s1 .icon{animation:secIcon 13s linear 2.6s infinite}
.s2 .card{animation:secCard 13s linear 5.2s infinite}.s2 .fw rect{animation:secChip 13s linear 5.2s infinite}.s2 .fw text{animation:secChipT 13s linear 5.2s infinite}.s2 .icon{animation:secIcon 13s linear 5.2s infinite}
.s3 .card{animation:secCard 13s linear 7.8s infinite}.s3 .fw rect{animation:secChip 13s linear 7.8s infinite}.s3 .fw text{animation:secChipT 13s linear 7.8s infinite}.s3 .icon{animation:secIcon 13s linear 7.8s infinite}
.s4 .card{animation:secCard 13s linear 10.4s infinite}.s4 .fw rect{animation:secChip 13s linear 10.4s infinite}.s4 .fw text{animation:secChipT 13s linear 10.4s infinite}.s4 .icon{animation:secIcon 13s linear 10.4s infinite}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important}}

.fx0{filter:drop-shadow(0px 5px 10px rgba(142, 118, 216, 0.039))}
.fx1{filter:drop-shadow(0px 5px 10px rgba(142, 118, 216, 0.039))}
.fx2{filter:drop-shadow(0px 5px 10px rgba(142, 118, 216, 0.039))}
.fx3{filter:drop-shadow(0px 5px 10px rgba(142, 118, 216, 0.039))}
.fx4{filter:drop-shadow(0px 5px 10px rgba(142, 118, 216, 0.039))}


