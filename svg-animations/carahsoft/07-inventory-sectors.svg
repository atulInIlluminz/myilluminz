:is(g,path,circle,ellipse,line,rect,polygon):not([transform]):not(clipPath *):not(mask *){transform-box:fill-box;transform-origin:center}
text{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.link{fill:none;stroke:#a59aff;stroke-width:2;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.2s cubic-bezier(.22,1,.36,1) forwards;transition:stroke .3s,stroke-width .3s}
.link-1{animation-delay:.1s}.link-2{animation-delay:.2s}.link-3{animation-delay:.3s}.link-4{animation-delay:.4s}
.endpoint{fill:#a59aff;transition:fill .3s}
.packet{fill:#7f5fd9;opacity:.9}
.sector{cursor:pointer;outline:none;transition:transform .5s cubic-bezier(.22,1,.36,1);animation:secIn .7s cubic-bezier(.22,1,.36,1) both}
.sector[data-i="1"]{animation-delay:.08s}.sector[data-i="2"]{animation-delay:.16s}.sector[data-i="3"]{animation-delay:.24s}.sector[data-i="4"]{animation-delay:.32s}
@keyframes secIn{from{opacity:0;translate:30px 0}}
.card{fill:#fff;stroke:#ebe5ff;transition:stroke .3s,filter .4s}
.ttl{font-size:17px;font-weight:500;fill:#170b3b}
.lbl{font-size:10px;letter-spacing:.08em;fill:#8b76e0;font-weight:500}
.fw rect{fill:#f7f3ff;stroke:#e3dafd;transition:fill .3s,stroke .3s}
.fw text{font-size:11px;font-weight:500;fill:#3d2690;transition:fill .3s}
.icon{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sector.on{transform:translateX(-6px)}
.sector.on .card{stroke:#b8a3ff;filter:drop-shadow(0 18px 24px rgba(105,67,199,.35))}
.sector.on .fw rect{fill:#6943c7;stroke:#6943c7}.sector.on .fw text{fill:#fff}
.sector.on .icon{transform:scale(1.06) rotate(-4deg)}
svg[data-active="0"] .link-0,svg[data-active="1"] .link-1,svg[data-active="2"] .link-2,svg[data-active="3"] .link-3,svg[data-active="4"] .link-4{stroke:#6943c7;stroke-width:3.5}
svg[data-active="0"] .ep-0,svg[data-active="1"] .ep-1,svg[data-active="2"] .ep-2,svg[data-active="3"] .ep-3,svg[data-active="4"] .ep-4{fill:#6943c7;animation:c3-pulse 1s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes c3-pulse{50%{scale:1.4}}
#hub-orbit {animation: orbit-spin 30s linear infinite; }
#hub-orbit-2 {animation: orbit-spin 46s linear infinite reverse; }
#hub-hub-glow {animation: c3-pulse 3s ease-in-out infinite; }
#hub-platform-face {animation: h-bob 3s ease-in-out infinite; }
#hub-layered-platform {animation: h-bob 3s ease-in-out -.4s infinite; }
@keyframes h-bob { 50% { translate: 0 -7px; } }
@keyframes c3-pulse { 50% { scale: 1.06; } }
@keyframes orbit-spin { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001s!important}}
