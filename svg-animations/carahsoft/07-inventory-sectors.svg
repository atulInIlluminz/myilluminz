(()=>{const svg=document.documentElement;
function replay(){document.getAnimations().forEach(a=>{a.currentTime=0;a.play()});if(svg.setCurrentTime)svg.setCurrentTime(0)}
const cards=[...svg.querySelectorAll('.sector')];let active=0,hovering=false;
const set=i=>{active=i;svg.dataset.active=i;cards.forEach((c,j)=>c.classList.toggle('on',j===i))};set(0);
cards.forEach((c,i)=>{c.addEventListener('mouseenter',()=>{hovering=true;set(i)});c.addEventListener('focus',()=>{hovering=true;set(i)});
c.addEventListener('mouseleave',()=>hovering=false);c.addEventListener('blur',()=>hovering=false)});
setInterval(()=>{if(!hovering)set((active+1)%cards.length)},2600);})();
]]></script></svg>