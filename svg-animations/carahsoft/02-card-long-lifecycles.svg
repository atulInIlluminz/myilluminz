<svg viewBox="0 0 567 355" fill="none" xmlns="http://www.w3.org/2000/svg" width="567" height="355" role="img"><title>Long system lifecycles</title><style>
:is(g,path,circle,ellipse,line,rect,polygon):not([transform]):not(clipPath *):not(mask *){transform-box:fill-box;transform-origin:center}
svg{cursor:pointer}
#c1-vector {stroke-dasharray: 640; stroke-dashoffset: 640; transition: stroke-width .3s; }
#c1-vector {animation: draw 1.5s cubic-bezier(.22,1,.36,1) .1s forwards; }
#c1-rectangle-3, #c1-rectangle-2, #c1-rectangle, .node, #c1-vector-11 {scale: 0; transition: transform .45s cubic-bezier(.22,1,.36,1), fill .3s; }
#c1-vector-11 {animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
#c1-rectangle-3 {animation: pop .6s cubic-bezier(.34,1.56,.64,1) .25s forwards; }
#c1-rectangle-2 {animation: pop .6s cubic-bezier(.34,1.56,.64,1) .65s forwards; }
#c1-rectangle {animation: pop .6s cubic-bezier(.34,1.56,.64,1) 1.05s forwards; }
#c1-node-1 {animation: pop .55s cubic-bezier(.34,1.56,.64,1) .4s forwards; }
#c1-node-2 {animation: pop .55s cubic-bezier(.34,1.56,.64,1) .8s forwards; }
#c1-node-3 {animation: pop .55s cubic-bezier(.34,1.56,.64,1) 1.2s forwards; }
#c1-vector-12 {opacity: 0; }
#c1-vector-12 {animation: c1-arrow .6s cubic-bezier(.22,1,.36,1) 1.35s forwards; }
#c1-vector-4, #c1-vector-7, #c1-vector-10 {animation: spin 3.6s cubic-bezier(.22,1,.36,1) infinite; }
#c1-vector-7 {animation-delay: 1.2s; }
#c1-vector-10 {animation-delay: 2.4s; }
#c1-vector-2, #c1-vector-5, #c1-vector-8 {animation: march 1.2s linear infinite; }
svg:hover #c1-rectangle-3, svg:hover #c1-rectangle-2, svg:hover #c1-rectangle {transform: translateY(-6px); }
svg:hover #c1-rectangle {fill: #b9a1ff; }
svg:hover #c1-vector {stroke-width: 7; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { scale: 0; } to { scale: 1; } }
@keyframes c1-arrow { from { opacity: 0; translate: -22px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes spin { 0%, 40% { rotate: 0deg; } 100% { rotate: 360deg; } }
@keyframes march { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001s!important}}




</style>
