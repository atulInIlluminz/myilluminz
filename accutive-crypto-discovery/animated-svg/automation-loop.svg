<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="Continuous automation loop"><title>Continuous automation loop</title><style>.p{font-family:Poppins,system-ui,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><line x1="0" x2="900" y1="12" y2="12" stroke="#7f5fd9" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 8"/><g><circle cx="0" cy="12" r="11" fill="#7f5fd9" fill-opacity=".2"/><circle cx="0" cy="12" r="5" fill="#7f5fd9"/><animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="5s" repeatCount="indefinite"/></g></svg>
